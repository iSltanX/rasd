<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>عيّنة الأداء — عشرون شاشة</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.7 system-ui,
          sans-serif;
        background: #fff;
        color: #111827;
      }

      /* رأس لاصق يتكرّر في كل بلاطة — الكلفة الواقعية لصفحة طويلة */
      header {
        position: sticky;
        inset-block-start: 0;
        z-index: 50;
        padding: 12px 20px;
        background: #111827;
        color: #fff;
        font-weight: 700;
      }

      /*
        شاشة = ارتفاع النافذة بالضبط (100vh) والفائض مقصوص، فالعدد عشرون (زائد الرأس اللاصق) أيًّا كان
        مقاس النافذة — قِيس أن `min-block-size` تترك البطاقات تمدّ الشاشة إلى 1.4 من النافذة فيصير
        العدد 27.9. وفي كل شاشة نصٌّ وبطاقات لا لونٌ مسطّح: لقطة ملوَّنة بلا تفاصيل تُضغط بسرعة
        فتُخفي كلفة الترميز الحقيقية.
      */
      .screen {
        block-size: 100vh;
        overflow: hidden;
        padding: 40px 24px;
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .screen h2 {
        margin: 0;
        font-size: 40px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .card {
        padding: 14px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(17, 24, 39, 0.2);
      }
    </style>
  </head>
  <body>
    <header id="head">رأس لاصق — عيّنة عشرين شاشة</header>
    <main id="screens"></main>

    <script>
      const SCREENS = 20
      const LOREM =
        'نصّ عربي طويل يملأ البطاقة كي لا تكون اللقطة لونًا مسطّحًا يُضغط إلى لا شيء؛ ' +
        'فترميز الصورة له كلفة تتبع محتواها.'
      const host = document.getElementById('screens')
      const frag = document.createDocumentFragment()
      for (let i = 0; i < SCREENS; i++) {
        const s = document.createElement('section')
        s.className = 'screen'
        s.dataset.index = String(i)
        s.style.background = `hsl(${(i * 47) % 360} 60% 88%)`
        let cards = ''
        for (let c = 0; c < 18; c++)
          cards += `<div class="card"><b>بطاقة ${i}.${c}</b><p>${LOREM}</p></div>`
        s.innerHTML = `<h2>الشاشة ${i + 1} من ${SCREENS}</h2><div class="cards">${cards}</div>`
        frag.appendChild(s)
      }
      host.appendChild(frag)
      window.__screens = SCREENS
      document.title = `perf-20screens · ${SCREENS} شاشة · ${document.documentElement.scrollHeight}px`
    </script>
  </body>
</html>
