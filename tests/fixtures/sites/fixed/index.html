<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>عيّنة العناصر الثابتة</title>
    <!--
      المصفوفة #6 (`fixed/`): ثلاثة عناصر `position: fixed` — لافتة كوكيز أسفل النافذة (#cookie)
      وفقاعة دردشة في الزاوية (#chat) وزرّ عودة للأعلى (#to-top) — فوق محتوى طويل (نحو 10 شاشات).
      يختبر ألّا تتكرّر في كل بلاطة من الالتقاط الكامل. لا شبكة ولا مؤقّتات.
      المسار البرمجي: `window.__fixedRects()` يرجع مستطيلات العناصر الثلاثة.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.7 system-ui,
          sans-serif;
        background: #fff;
        color: #0f172a;
      }
      .block {
        block-size: 600px;
        margin: 16px;
        padding: 16px;
        background: #f1f5f9;
        border-radius: 8px;
      }
      #cookie {
        position: fixed;
        inset-inline: 0;
        inset-block-end: 0;
        z-index: 30;
        padding: 16px;
        background: #7c2d12;
        color: #fff;
        text-align: center;
      }
      #chat {
        position: fixed;
        inset-inline-start: 20px;
        inset-block-end: 90px;
        z-index: 20;
        inline-size: 64px;
        block-size: 64px;
        border-radius: 50%;
        background: #2563eb;
        color: #fff;
        display: grid;
        place-items: center;
      }
      #to-top {
        position: fixed;
        inset-inline-end: 20px;
        inset-block-end: 90px;
        z-index: 20;
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background: #0f172a;
        color: #fff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main id="main"></main>
    <div id="cookie" role="region" aria-label="الكوكيز">نستخدم ملفّات الكوكيز لتحسين التجربة.</div>
    <div id="chat" aria-label="دردشة">دردشة</div>
    <button id="to-top" type="button" onclick="scrollTo(0, 0)">إلى الأعلى</button>
    <script>
      const main = document.getElementById('main')
      for (let i = 1; i <= 10; i++) {
        const b = document.createElement('section')
        b.className = 'block'
        b.dataset.testid = `block-${i}`
        b.innerHTML = `<h2>القسم ${i}</h2><p>محتوى طويل ثابت تحته عناصر ثابتة الموضع.</p>`
        main.append(b)
      }
      window.__fixedRects = () => {
        const r = (id) => document.getElementById(id).getBoundingClientRect().toJSON()
        return { cookie: r('cookie'), chat: r('chat'), toTop: r('to-top') }
      }
    </script>
  </body>
</html>
