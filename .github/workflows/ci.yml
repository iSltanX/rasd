name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tokens are in sync with Figma snapshot
        run: pnpm run tokens:check

      - name: Token contract gate
        run: pnpm run verify:tokens

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: rasd-dist-${{ github.sha }}
          path: dist/
          retention-days: 14

  # ── الفحص الحيّ في كروم حقيقي ─────────────────────────────────────
  #
  # وظيفةٌ مستقلّة لا خطوةٌ في الأولى: تحتاج متصفّحًا، وزمنها من رتبة
  # دقيقتين، وفشلها يقول شيئًا مختلفًا — «الشيفرة صحيحة والسلوك ليس».
  #
  # وقبل هذه الوظيفة لم يكن أيّ `verify:*` يعمل في CI إطلاقًا: كل ما قيس
  # في المراحل 6 إلى 15 كان يُقاس على جهاز المطوّر وحده، فانحدارٌ في سلوك
  # المتصفّح كان يمرّ إلى `main` بلا أن يوقفه شيء.
  live:
    name: verify:editor · verify:library · كروم حقيقي
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # الحزمة تُبنى هنا لا تُنزَّل من الوظيفة الأولى: الفحص يحمّل `dist/`
      # في المتصفّح، وارتباطُه بوظيفة أخرى يجعله يسقط حين تسقط هي لسببٍ آخر.
      - name: Build
        run: pnpm run build

      # Ubuntu 24.04 على العدّاءات يقيّد **user namespaces غير المميّزة**
      # عبر AppArmor، وعليها يبني Chrome صندوقه الرملي. والأثر متقطّع لا
      # قاطع: مرّةً لا يُقلع المتصفّح أصلًا (‏«تعذّر الاتصال بـDevTools»)،
      # ومرّةً يُقلع ويُحمِّل الإضافة ثمّ يخرج سياق الـservice worker بلا
      # ربط `chrome` (‏«chrome is not defined»). القيمة تُطبَع أوّلًا دليلًا،
      # ثمّ تُرخى — فيبقى الصندوق الرملي **مفعَّلًا**، وهو أسلم من تعطيله
      # بـ`--no-sandbox` في ثمانية عشر سكربتًا.
      - name: Chrome version · وصندوق الرمل
        run: |
          echo "apparmor_restrict_unprivileged_userns = $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'غير معرَّف')"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          google-chrome --version

      - name: Editor engine in real Chrome
        run: pnpm run verify:editor
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # نفس البناء يخدم الفحصين — صفحة المكتبة إضافة صرفة بلا صلاحية
      # مضيف، فلا حاجة لخادم عيّنات كما يحتاج verify:editor.
      - name: Library page in real Chrome
        run: pnpm run verify:library
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # لقطات المراجعة البصرية — تُرفَع ولا تُقارَن آليًّا. المقارنة بالعين
      # مقصودة: خطُّ أساسٍ بكسليّ على متصفّح يتغيّر شهريًّا يُنتج فشلًا
      # كاذبًا أكثر ممّا يُنتج كشفًا.
      - name: Upload visual review shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rasd-live-shots-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: ignore

      # خطّ أساس شجرة الإتاحة — يُقرأ بالعين لا يُقارَن آليًّا (نفس منطق
      # اللقطات البصرية أعلاه)، فيُرفَع لا يُختبَر ضده تلقائيًا.
      - name: Upload accessibility tree baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rasd-a11y-baselines-${{ github.sha }}
          path: tests/visual-baselines/
          retention-days: 14
          if-no-files-found: ignore
