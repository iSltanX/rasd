name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── تصنيف التغيير: المسار الكامل أم مسار التوثيق ─────────────────
  #
  # قرارٌ حتميّ يُقرأ هنا، لا تقديرٌ من الوكيل: ملفّات الدفع تُطابَق على
  # `DOCS_ONLY`. ملفّ واحد خارجه — شيفرة، اختبار، سكربت، إعداد، أصل مشحون، أو
  # CI نفسه — يعني المسار الكامل. وما لا يُعرف (حدث يدويّ، أساس مفقود، قائمة
  # فارغة، أو سقوط هذه الوظيفة) يعني المسار الكامل أيضًا: الخطأ الآمن فحصٌ زائد.
  changes:
    name: تصنيف التغيير
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: كامل أم توثيق فقط
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # ملفّات لا تدخل الحزمة ولا يقرؤها اختبار ولا بناء. `Docs/` بامتداداتها لا
          # بمجلّدها: `Docs/Brand/build.mjs` سكربت يمرّ باللنت فيبقى للمسار الكامل.
          DOCS_ONLY: '^(AGENTS\.md|README\.md|Docs/.+\.(md|png|svg))$'
        run: |
          full() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "المسار الكامل — $1"; exit 0; }
          case "$EVENT" in
            push) from="$BEFORE"; to="$GITHUB_SHA"; dots=".." ;;
            pull_request) from="$PR_BASE"; to="$PR_HEAD"; dots="..." ;;
            *) full "الحدث «${EVENT}» يشغّل المسار الكامل دائمًا" ;;
          esac
          git cat-file -e "${from}^{commit}" 2>/dev/null || full "لا أساس للمقارنة: «${from}»"
          files=$(git diff --name-only "${from}${dots}${to}")
          [ -n "$files" ] || full "لا ملفّات متغيّرة"
          echo "الملفّات المتغيّرة:"
          echo "$files" | sed 's/^/  /'
          outside=$(echo "$files" | grep -Ev "$DOCS_ONLY" || true)
          [ -z "$outside" ] || full "ملفّات خارج التوثيق: $(echo "$outside" | head -5 | tr '\n' ' ')"
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "مسار التوثيق — البناء وحرّاس كروم العشرون تُتخطّى"

  # ── مسار التوثيق: فحوص الاتّساق وحدها ─────────────────────────────
  #
  # الفحوص التي يمكن أن يُسقطها تعديل توثيق: صفوف سجلّ القرارات، وجرد نقاط
  # الدخول المكتوب في `Docs/EntryPoints.md`، وتنسيق Markdown. لا بناء ولا اختبارات ولا متصفّح: لا شيء منها يقرأ هذه الملفّات.
  # **واسم الوظيفة مرجعٌ في `scripts/guards-sync.mjs`** — به يُعرف أن الجولة لم
  # تطلب حارسًا، فلا تُعدّ ثغرة في سجلّ الترقية. تغييره يُغيَّر هناك معه.
  docs:
    name: توثيق فقط · فحوص ساكنة
    needs: changes
    if: ${{ needs.changes.outputs.code == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: حارس سجلّ القرارات
        run: pnpm run docs:lint

      - name: حارس جرد نقاط الدخول
        run: pnpm run entrypoints:lint

      - name: Format check
        run: pnpm run format:check

  # ── المسار الكامل ─────────────────────────────────────────────────
  #
  # كل فحص مرّة واحدة في الجولة: `typecheck` هنا وحدها، والبناء و`verify:dist`
  # في «بناء الحزمة المشتركة» وحدها، والحرّاس العشرون على حزمتها.
  # والشرط `!= 'false'` لا `== 'true'`: إن سقط التصنيف نفسه جرى المسار الكامل.
  verify:
    name: فحوص ساكنة · typecheck · lint · test · coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tokens are in sync with Figma snapshot
        run: pnpm run tokens:check

      - name: Token contract gate
        run: pnpm run verify:tokens

      # هدف Firefox (SS3): بناؤه وفحص حزمته ومدقّق AMO نفسه (`web-ext lint`) — ساكنٌ بلا متصفّح، ودقيقةٌ في
      # أسوئها. `web-ext lint` يخرج بغير صفر عند أي خطأ؛ وسقف التحذيرات (تحذيرا `innerHTML` لأيقونات SVG ثابتة)
      # يفرضه `pnpm zip:firefox` عند الإصدار.
      - name: Firefox build
        run: pnpm run build:firefox

      - name: Firefox bundle gate
        run: pnpm run verify:dist --target firefox

      - name: Firefox add-on linter
        run: pnpm exec web-ext lint --source-dir dist-firefox

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      # الاختبارات مع التغطية في تشغيل واحد لا تشغيلان: العتبات في `vitest.config.ts`
      # (أرضية «لا انخفاض» عامّة، وأهداف الفروع لـ`modules/` و`shared/` و`ui/`)،
      # وهبوط أي نسبة دونها يُسقط هذه الخطوة فتظهر الوظيفة حمراء باسم «coverage».
      - name: Test with coverage thresholds
        run: pnpm run test:coverage

      # عمود `blocking` أدناه مشتقٌّ من `.github/guards-ledger.json`. الفحص هنا
      # بلا شبكة وبلا كروم — فلا يُدخِل الجولة في دورٍ حول نفسها — وموضعه هنا
      # لا في `gate:a` وحدها لأن البوّابة A تحرس جهاز المؤلِّف لا الفرع.
      - name: حارس سجلّ ترقية الحرّاس
        run: pnpm run guards:check

      # سجلّ حرّاس Firefox في ملفّه (ADR 0059) — يطابق خطوات وظيفة `firefox` أدناه والحرّاس المعرَّفة وبصماتها.
      - name: حارس سجلّ حرّاس Firefox
        run: pnpm run guards:firefox-check

      - name: حارس سجلّ القرارات
        run: pnpm run docs:lint

      - name: حارس جرد نقاط الدخول
        run: pnpm run entrypoints:lint

  # ── بناء واحد تتقاسمه الحرّاس ─────────────────────────────────────
  #
  # كانت كل وظيفة حارس تبني الحزمة لنفسها: قِيس 22 ثانية للبناء في كل واحدة من
  # تسع عشرة وظيفة (الجولة `36605241573`) — أي نحو سبع دقائق عدّاء في كل جولة
  # تعيد إنتاج الملفّات نفسها من الالتزام نفسه.
  #
  # **وظيفة مستقلّة لا خطوة في الأولى.** علّة البناء داخل كل حارس كانت ألّا يسقط
  # الحارس بسقوط وظيفة أخرى لسبب لا يخصّه: لنت أو اختبار وحدة. وهذه الوظيفة تحفظ
  # تلك العلّة: لا لنت فيها ولا اختبار، فلا تسقط إلا إن سقط البناء نفسه — وعندها
  # لا حزمة يفحصها حارس أصلًا. والوظيفة الأولى تبقى تبني لنفسها، فلا يحجب سقوط
  # البناء هنا نتيجة اللنت والاختبارات هناك.
  build:
    name: بناء الحزمة المشتركة
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `build:bundle` لا `build`: الأخير يعيد `typecheck` التي جرت في «فحوص ساكنة».
      - name: Build
        run: pnpm run build:bundle

      # حارس الحزمة المبنيّة — ساكن وسريع، ولا متصفّح يلزمه. موضعه هنا لأنه يفحص
      # `dist/` التي بُنيت للتوّ، وقبل الرفع كي لا تصل حزمة ساقطة إلى الحرّاس.
      - name: Bundle gate
        run: pnpm run verify:dist

      # `include-hidden-files`: الأثر يطابق مخرَج البناء ملفًّا ملفًّا، فما يحمّله
      # الحارس هو ما بُني لا مجموعة جزئية منه.
      - name: Upload extension bundle
        uses: actions/upload-artifact@v7
        with:
          name: rasd-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # ── الفحص الحيّ في كروم حقيقي ─────────────────────────────────────
  #
  # وظيفةٌ مستقلّة لا خطوةٌ في الأولى: تحتاج متصفّحًا، وزمنها من رتبة
  # دقيقتين، وفشلها يقول شيئًا مختلفًا — «الشيفرة صحيحة والسلوك ليس».
  #
  # وقبل هذه الوظيفة لم يكن أيّ `verify:*` يعمل في CI إطلاقًا: كل ما قيس
  # قبلها كان يُقاس على جهاز المطوّر وحده، فانحدارٌ في سلوك
  # المتصفّح كان يمرّ إلى `main` بلا أن يوقفه شيء.
  #
  # **ومصفوفةٌ لا خطوات متتابعة.** كانت الوظيفة تشغّل حارسَين من سبعة عشر،
  # فبقي خمسة عشر حارسًا مكتوبًا لا يعمل في البيئة التي يُفترض أن يحرسها —
  # وهو عين ما كشفه أوّل تشغيل (الصفّان 95 و96 في `§6`): حارسٌ لم يُشغَّل
  # في بيئته ليس حارسًا مُثبَتًا. ووظيفةٌ لكل حارس تعني: عزل الفشل (‏`fail-fast:
  # false` — سقوط واحد لا يُسكِت البقيّة)، وتوازيًا يجعل زمن الجولة زمنَ
  # أبطأ حارس لا مجموعهم، وسطرًا في صفحة الفحوص يسمّي الساقط بعينه.
  live:
    name: كروم حقيقي · verify:${{ matrix.guard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # **`blocking` عمودٌ مشتقّ لا مكتوب بيد — والقاعدة شيفرةٌ لا تعليق.**
    #
    # كانت قاعدة الترقية («عشر جولات خضراء متتالية») نثرًا هنا، وكان العمود
    # يُكتَب باليد: أي ادّعاءً لا يستطيع شيءٌ أن ينقضه. صار الاثنان مشتقَّين
    # من سجلٍّ مقيس — `scripts/guards-sync.mjs` و`.github/guards-ledger.json` —
    # و`pnpm guards:check` يُسقط الجولة عند أي انحراف، **في الاتجاهين**:
    # مُرقّى لم يعد مؤهَّلًا، ومؤهَّل لم يُرقَّ بعد.
    #
    # **وحُسم السبب المشترك بالنفي.** كان السجلّ على أربع
    # جولات يقرأ «مجموعة الساقطين تتحرّك ⇐ سببٌ مشترك في البيئة (تزاحم موارد)».
    # والقياس نقض ذلك: الأربعة الثابتون على الصفر كان لكلٍّ منهم سببٌ خاصّ
    # مسمًّى — لا سبب واحد. وتزاحمُ الموارد نفسه منفيٌّ بالقياس: كل وظيفة
    # مصفوفة تُقلع على **عدّاء مستقلّ**، والخطوة «هُويّة العدّاء» أدناه تطبع
    # اسم المضيف وعدد أنويته لتبقى الحجّة مقروءةً في كل جولة لا مذكورةً هنا.
    # التفصيل الكامل في `Docs/Engineering.md §6` الصفّ 98.
    #
    # وما بقي غير حاجبٍ يبقى **ظاهرًا مسمًّى بنتيجته**: لا يُحذف فيعود إلى
    # الاختفاء الذي بُني هذا كلّه لإنهائه، ولا يحجب الدمج قبل أن يستوفي
    # العتبة. والعمود أدناه لا يُحرَّر بيد — يكتبه `pnpm guards:sync`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { guard: accessibility, blocking: false }
          - { guard: activate, blocking: false }
          - { guard: capture, blocking: false }
          - { guard: capturing, blocking: false }
          - { guard: colour, blocking: false }
          - { guard: compare, blocking: false }
          - { guard: compare-diff, blocking: false }
          - { guard: editor, blocking: false }
          - { guard: export, blocking: false }
          - { guard: fullpage, blocking: false }
          - { guard: gate, blocking: false }
          - { guard: inspect, blocking: false }
          - { guard: issues, blocking: false }
          - { guard: library, blocking: false }
          - { guard: lifecycle, blocking: false }
          - { guard: lighthouse, blocking: false }
          - { guard: load, blocking: false }
          - { guard: measure, blocking: false }
          - { guard: memory, blocking: false }
          - { guard: network, blocking: false }
          - { guard: overlay, blocking: false }
          - { guard: palette, blocking: false }
          - { guard: picker, blocking: false }
          - { guard: popup, blocking: false }
          - { guard: share, blocking: false }
          - { guard: visual, blocking: false }

    # الوظيفة غير الحاجبة تظهر ✗ في صفحة الفحوص ولا تُسقِط الجولة.
    continue-on-error: ${{ !matrix.blocking }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # الحزمة تُنزَّل من وظيفة «بناء الحزمة المشتركة» ولا تُبنى هنا. ولا تُنزَّل
      # من الوظيفة الأولى: ارتباط الحارس بها يجعله يسقط حين تسقط هي بلنت أو
      # اختبار. وكل حارس من العشرين يتحقّق بنفسه من وجود الحزمة قبل أن يبدأ،
      # فحزمة غائبة تُسقطه برسالة صريحة لا بنجاح كاذب.
      - name: Download extension bundle
        uses: actions/download-artifact@v4
        with:
          name: rasd-dist-${{ github.sha }}
          path: dist/

      # Ubuntu 24.04 على العدّاءات يقيّد **user namespaces غير المميّزة**
      # عبر AppArmor، وعليها يبني Chrome صندوقه الرملي. والأثر متقطّع لا
      # قاطع: مرّةً لا يُقلع المتصفّح أصلًا (‏«تعذّر الاتصال بـDevTools»)،
      # ومرّةً يُقلع ويُحمِّل الإضافة ثمّ يخرج سياق الـservice worker بلا
      # ربط `chrome` (‏«chrome is not defined»). القيمة تُطبَع أوّلًا دليلًا،
      # ثمّ تُرخى — فيبقى الصندوق الرملي **مفعَّلًا**، وهو أسلم من تعطيله
      # بـ`--no-sandbox` في ثمانية عشر سكربتًا.
      # **هُويّة العدّاء — دليلٌ مطبوع لا حجّةٌ مكتوبة.** فرضية «تزاحم سبع عشرة
      # وظيفة على الموارد» تُنفى أو تُثبَت هنا في كل جولة.
      #
      # و`hostname` **لا يميّز**: قِيس أن السبع عشرة وظيفة كلّها تطبع
      # `runnervmlun5p` — الاسم مخبوز في صورة العدّاء لا مولَّد لكل آلة.
      # فالمُعرِّف هو `/proc/sys/kernel/random/boot_id`: فريدٌ لكل إقلاع نواة،
      # فاختلافه عبر الوظائف يعني آلاتٍ منفصلة لا حصصًا من آلة واحدة.
      - name: هُويّة العدّاء — نفيًا لفرضية التزاحم
        run: |
          echo "boot=$(cat /proc/sys/kernel/random/boot_id) · host=$(hostname) · cores=$(nproc) · mem=$(free -m | awk '/^Mem:/{print $2}')MB · guard=${{ matrix.guard }}"

      - name: Chrome version · وصندوق الرمل
        run: |
          echo "apparmor_restrict_unprivileged_userns = $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'غير معرَّف')"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          google-chrome --version

      # **مهلة على الخطوة لا على الوظيفة وحدها — والفرق ليس تجميليًّا.**
      #
      # قِيس: `verify:load` علّق عشرين دقيقة كاملة (كروم لم يُقلع ولم يمت)
      # حتى بلغ `timeout-minutes` الوظيفة، فخرجت **ملغاة** لا فاشلة —
      # و`continue-on-error` **لا يشمل الإلغاء**: فأُلغيت الجولة كلّها رغم
      # أن أحدًا من الحرّاس ليس حاجبًا. أي أن «غير حاجب» لم يكن يعني ما
      # يقوله ما دام حارسٌ واحد قادرًا على ابتلاع الجولة بتعليقه.
      #
      # فمهلةُ الخطوة تجعل المعلَّق يسقط **فشلًا** يبتلعه `continue-on-error`.
      # وستّ دقائق سقفٌ مقيس لا مقدَّر: أبطأ حارس ناجح على العدّاء أقلّ من
      # دقيقتين (‏`verify:editor` ≈ 1m10s شاملًا البناء)، فالثلاثة أضعاف
      # هامشٌ يميّز «بطيء» من «معلَّق».
      - name: verify:${{ matrix.guard }} in real Chrome
        run: pnpm run verify:${{ matrix.guard }}
        timeout-minutes: 6
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # لقطات المراجعة البصرية — تُرفَع لتُقرأ بالعين، ويقارن الحارس `visual` أسطحها بخطوط الأساس آليًّا
      # (`STAGES/26`، ADR 0052) وتكتب صورة الفرق في `artifacts/visual-diff/` فتُرفَع هنا أيضًا. واسم
      # الأثر يحمل اسم الحارس لأن `upload-artifact@v4` يرفض تكرار الاسم بين وظائف المصفوفة.
      - name: Upload visual review shots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rasd-live-shots-${{ matrix.guard }}-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: ignore

      # أشجار الإتاحة — تُقرأ بالعين ولا تُقارَن آليًّا: التغيّر فيها متوقَّع مع كل إضافة، فتُرفَع لا
      # يُختبَر ضدّها. أمّا صور المجلّد نفسه فيقارنها `visual`.
      - name: Upload accessibility tree baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rasd-a11y-baselines-${{ matrix.guard }}-${{ github.sha }}
          path: tests/visual-baselines/
          retention-days: 14
          if-no-files-found: ignore

  # ── حرّاس Firefox في Firefox حقيقي (SS7، ADR 0059) ─────────────────
  #
  # **وظيفةٌ واحدة بخطوةٍ لكل حارس، لا مصفوفة:** Firefox يُثبَّت مرّة ويُبنى `dist-firefox/` مرّة، والحرّاس الأربعة عشر
  # تجري تباعًا كما تجري محلّيًّا تحت `pnpm verify:firefox`. وكل خطوة باسم حارسها (`firefox:<name>`) فيقرأ سجلّ الترقية
  # (`scripts/firefox-ledger.mjs`) خاتمتها هي — اسم الوظيفة والخطوات مرجعٌ هناك وفي اختباره، تغييرها يُغيَّر معه.
  #
  # **غير حاجبة كلّها** (`continue-on-error: true`، ADR 0026: CI استشاري): وظيفة Firefox تُقرأ ولا تُنتظر، والترقية قرار
  # المالك بعد عشر جولات خضراء في السجلّ. و`if: !cancelled()` على كل خطوة كي لا يُسكت سقوطُ حارسٍ ما بعده، ومهلةٌ لكل
  # خطوة دون مهلة الوظيفة كي يسقط المعلَّق فشلًا لا إلغاءً (الدرس نفسه على خطوة حرّاس كروم أعلاه). وبناءٌ ساقط يُخطّي
  # الحرّاس فتُسجَّل ثغرةً لا حمرة: لم تُفحص حزمةٌ لم تُبنَ.
  firefox:
    name: Firefox حقيقي · حرّاس BiDi
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest

      - name: Firefox version
        run: ${{ steps.firefox.outputs.firefox-path }} --version

      - name: Build Firefox target
        id: build
        run: pnpm run build:firefox

      - name: firefox:load
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:load
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:popup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:popup
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:activate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:activate
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:measure
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:measure
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:inspect
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:inspect
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:colour
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:colour
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:capture
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:capture
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:fullpage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:fullpage
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:editor
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:editor
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:export
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:export
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:library
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:library
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:report
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:lifecycle
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      - name: firefox:network
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run firefox:network
        timeout-minutes: 6
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

      # لقطات الطبقة (`artifacts/firefox/`) — تُرفع لتُقرأ بالعين، ولا تُقارَن آليًّا.
      - name: Upload Firefox review shots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rasd-firefox-shots-${{ github.sha }}
          path: artifacts/firefox/
          retention-days: 14
          if-no-files-found: ignore

  # ── مسارات المنتج الأربعة من طرف إلى طرف (`STAGES/18`، ADR 0045) ──
  #
  # وظيفةٌ مستقلّة لا خطوةٌ في «الفحص الحيّ»: الحرّاس تثبت **محرّكًا** كلٌّ على حدة، وهذه تثبت
  # **السلسلة** — التقاط ← تعليق ← تصدير ← مكتبة، وأخواتها — بكثافتَي 1 و2 في كروم حقيقي. فشلها يقول
  # شيئًا آخر: «كل جزءٍ يعمل وحده والمسار لا يمرّ».
  #
  # **ولا تُبنى هنا ولا تُشغَّل بمصفوفة.** الحزمة تُنزَّل من وظيفة البناء المشتركة كالحرّاس، والكثافتان
  # مشروعان في Playwright يجريان تباعًا في كروم واحد: عاملٌ واحد ولا إعادة، فمسارٌ ينجح في المحاولة
  # الثانية يُحسب ساقطًا (معيار «صفر تقطّع» يقيسه `pnpm test:e2e --runs 10`).
  #
  # **غير حاجبة إلى أن تُقاس.** جولات CI الخضراء العشر هي ما يرقّي الحرّاس إلى حاجبة (`guards-sync.mjs`)،
  # وهذه الوظيفة لم تُقَس في CI بعد: تظهر ✗ باسمها إن سقطت ولا تُسقط الجولة. ويُرقّيها المالك بحذف
  # `continue-on-error` بعد عشر جولات خضراء.
  e2e:
    name: مسارات E2E · الكثافتان 1 و2
    needs: build
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download extension bundle
        uses: actions/download-artifact@v4
        with:
          name: rasd-dist-${{ github.sha }}
          path: dist/

      # القيد نفسه الذي تعالجه وظيفة الحرّاس (user namespaces على Ubuntu 24.04). وPlaywright يُقلع كروم
      # بـ`--no-sandbox` افتراضًا — لا بأس هنا: لا يفتح إلا عيّنات محلّية صامتة شبكيًّا — لكن القيمة
      # تُرخى وتُطبَع كي يبقى الفرق بين وظيفتَي كروم في الجولة مقروءًا.
      - name: Chrome version · وصندوق الرمل
        run: |
          echo "apparmor_restrict_unprivileged_userns = $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'غير معرَّف')"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          google-chrome --version

      # مهلة الخطوة دون مهلة الوظيفة كي يسقط المعلَّق **فشلًا** لا إلغاءً (`continue-on-error` لا يشمل الإلغاء)
      # — الدرس نفسه المسجَّل على خطوة الحرّاس أعلاه.
      - name: pnpm test:e2e in real Chrome
        run: pnpm run test:e2e
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # أثر Playwright (تتبّعٌ ولقطةٌ للساقط) ولقطات المراجعة — تُرفع ولا تُقارَن آليًّا.
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rasd-e2e-${{ github.sha }}
          path: artifacts/e2e/
          retention-days: 14
          if-no-files-found: ignore
